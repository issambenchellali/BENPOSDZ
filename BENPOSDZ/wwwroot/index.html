<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BENPOSDZ</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="BENPOSDZ.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        /* إظهار أخطاء Blazor غير المعالجة بدلاً من صفحة فارغة صامتة */
        #blazor-error-ui {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #dc3545;
            color: #fff;
            padding: 14px 20px;
            text-align: center;
            font-family: Arial, sans-serif;
            font-size: 14px;
            direction: rtl;
            z-index: 99999;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        #blazor-error-ui .reload { color: #ffeeba; margin: 0 10px; }
        #blazor-error-ui .dismiss { position: absolute; top: 6px; left: 12px; cursor: pointer; background: none; border: none; color: #fff; font-size: 16px; }
        #blazor-error-ui .err-msg { display: block; margin-top: 6px; font-size: 12px; opacity: 0.9; }
    </style>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        حدث خطأ غير متوقع.
        <a href="" class="reload">إعادة تحميل</a>
        <a class="dismiss">🗙</a>
        <span class="err-msg" id="blazor-error-msg"></span>
    </div>

    <script>
        // التقاط الأخطاء غير المعالجة وإظهارها بدلاً من صفحة فارغة
        window.addEventListener('error', function (e) {
            var msg = (e && e.message) ? e.message : (e && e.error && e.error.message ? e.error.message : 'خطأ غير متوقع');
            var el = document.getElementById('blazor-error-ui');
            var m = document.getElementById('blazor-error-msg');
            if (m) m.textContent = msg;
            if (el) el.style.display = 'block';
        });
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
<script>
    window.printDocument = function(docType, jsonData) {
        var data = JSON.parse(jsonData);
        var printFrame = document.createElement('iframe');
        printFrame.style.position = 'absolute';
        printFrame.style.top = '-1000px';
        document.body.appendChild(printFrame);

        var doc = printFrame.contentWindow.document;
        doc.open();
        
        // تحديد العرض حسب نوع الطباعة (80mm للوصل، A4 للفاتورة)
        var widthStyle = docType === 'receipt' ? 'width: 80mm;' : 'width: 210mm; padding: 20mm;';
        doc.write('<html><head><title>Print</title>');
        doc.write('<style>');
        doc.write('body { font-family: Arial, sans-serif; ' + widthStyle + ' direction: rtl; }');
        doc.write('table { width: 100%; border-collapse: collapse; margin-top: 10px;} th, td { border: 1px solid #ddd; padding: 5px; text-align: right;}');
        doc.write('.text-center { text-align: center; } .total { text-align: left; font-weight: bold; margin-top: 10px; } h1, h2 { text-align: center; }');
        doc.write('@media print { body { width: ' + (docType === 'receipt' ? '80mm' : 'auto') + '; } }');
        doc.write('</style></head><body>');
        
        doc.write('<h2>BEN POS - متجر التجارة</h2>');
        doc.write('<p>رقم: ' + data.invoiceId + ' | التاريخ: ' + data.date + '</p>');
        doc.write('<p>الزبون: ' + data.customer + '</p>');
        
        doc.write('<table><thead><tr><th>السلعة</th><th>الكمية</th>');
        if(docType !== 'delivery') {
            doc.write('<th>السعر</th><th>المجموع</th>');
        } else {
            doc.write('<th>التوقيع</th>');
        }
        doc.write('</tr></thead><tbody>');
        
        data.items.forEach(item => {
            doc.write('<tr><td>' + item.name + '</td><td>' + item.qty + '</td>');
            if(docType !== 'delivery') {
                doc.write('<td>' + item.price.toFixed(2) + '</td><td>' + item.total.toFixed(2) + '</td>');
            } else {
                doc.write('<td></td>');
            }
        });
        
        doc.write('</tbody></table>');
        
        if(docType !== 'delivery') {
            doc.write('<div class="total">المجموع: ' + data.total.toFixed(2) + ' د.ج</div>');
            doc.write('<div class="total">المدفوع: ' + data.paid.toFixed(2) + ' د.ج</div>');
            if(data.debt > 0) {
                doc.write('<div class="total" style="color:red;">الدين: ' + data.debt.toFixed(2) + ' د.ج</div>');
            }
        } else {
            doc.write('<br/><br/><div style="display:flex; justify-content:space-between;"><span>توقيع البائع: ........................</span><span>توقيع الزبون: ........................</span></div>');
        }
        
        doc.write('<p class="text-center">شكرا لزيارتكم</p>');
        doc.write('</body></html>');
        doc.close();

        setTimeout(function() {
            printFrame.contentWindow.focus();
            printFrame.contentWindow.print();
            setTimeout(function() { document.body.removeChild(printFrame); }, 500);
        }, 500);
    };
</script>
<script>
    window.printHtml = function(html, isReceipt) {
        var printFrame = document.createElement('iframe');
        printFrame.style.position = 'absolute';
        printFrame.style.top = '-1000px';
        printFrame.style.left = '-1000px';
        document.body.appendChild(printFrame);

        var doc = printFrame.contentWindow.document;
        doc.open();
        doc.write(html);
        doc.close();

        setTimeout(function() {
            printFrame.contentWindow.focus();
            printFrame.contentWindow.print();
            setTimeout(function() { document.body.removeChild(printFrame); }, 500);
        }, 500);
    };
</script>

<script>
    // تنزيل المعاينة كملف Word (.doc) — يعمل بمتصفحات WebView2 التي تسمح بالتنزيل
    window.downloadDoc = function(html, filename) {
        try {
            var blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename || 'document.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
        } catch (e) {
            alert('تعذر تنزيل الملف: ' + e.message);
        }
    };
</script>

<script>
    // تفعيل سحب وإفلات الحقول في محرر القوالب (مع حماية من التكرار عند إعادة الرسم)
    window.initTemplateEditor = function(dropTargetId) {
        document.querySelectorAll('.ph-chip').forEach(function(el) {
            if (el.__initDone) return;
            el.__initDone = true;
            el.setAttribute('draggable', 'true');
            el.addEventListener('dragstart', function(ev) {
                ev.dataTransfer.setData('text/plain', el.getAttribute('data-token'));
            });
        });

        var ta = document.getElementById(dropTargetId);
        if (ta && !ta.__dropBound) {
            ta.__dropBound = true;
            ta.addEventListener('dragover', function(ev) { ev.preventDefault(); });
            ta.addEventListener('drop', function(ev) {
                ev.preventDefault();
                var token = ev.dataTransfer.getData('text/plain');
                if (!token) return;
                var start = ta.selectionStart || 0;
                var end = ta.selectionEnd || 0;
                ta.value = ta.value.slice(0, start) + token + ta.value.slice(end);
                ta.selectionStart = ta.selectionEnd = start + token.length;
                ta.focus();
                ta.dispatchEvent(new Event('input', { bubbles: true }));
            });
        }
    };
</script>
</body>

</html>
