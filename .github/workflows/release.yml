name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'الإصدار (مثال: 1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: تحديد الإصدار
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event.inputs.version }}' -ne '') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: نشر التطبيق الرئيسي (BENPOSDZ)
        run: dotnet publish BENPOSDZ/BENPOSDZ.csproj -c Release -f net8.0-windows10.0.19041.0 -r win-x64 --self-contained true -p:PublishSingleFile=true -p:WindowsPackageType=None -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} -p:ApplicationVersion=1

      - name: نشر أداة التحديث (BENPOSUpdater)
        run: dotnet publish BENPOSUpdater/BENPOSUpdater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o release/updater

      - name: تجميع الحزمة وتوليد version.json
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $pub = "BENPOSDZ/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish"
          $pkg = "release/package"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item "$pub/*" $pkg -Recurse -Force
          Copy-Item "release/updater/BENPOSUpdater.exe" $pkg -Force
          Get-ChildItem $pkg -Filter *.pdb | Remove-Item -Force
          $zip = "release/BENPOSDZ_$v.zip"
          Compress-Archive -Path "$pkg/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $json = @{ version = $v; notes = "تحديث BENPOSDZ v$v"; sha256 = $hash; zipUrl = '' } | ConvertTo-Json
          Set-Content -Path "release/version.json" -Value $json -Encoding UTF8
          Write-Host "ZIP=$zip`nSHA=$hash"

      - name: رفع الأصول إلى GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/BENPOSDZ_*.zip
            release/version.json

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: تثبيت عمل Maui Android
        run: dotnet workload install maui-android

      - name: تثبيت JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تثبيت Android SDK (مع قبول التراخيص)
        uses: android-actions/setup-android@v3

      - name: تحديد الإصدار
        id: version
        shell: pwsh
        run: |
          $v = if ('${{ github.event.inputs.version }}' -ne '') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $code = if ($v -match '^(\d+)\.(\d+)(?:\.(\d+))?') { ([int]$Matches[1] * 10000) + ([int]$Matches[2] * 100) + ([int]$Matches[3]) } else { 1 }
          "versionCode=$code" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: تفعيل التوقيع من أسرار GitHub (اختياري)
        shell: pwsh
        run: |
          if ('${{ secrets.ANDROID_KEYSTORE }}' -ne '') {
            [System.IO.File]::WriteAllBytes("$env:RUNNER_TEMP\benpos-release.keystore", [System.Convert]::FromBase64String('${{ secrets.ANDROID_KEYSTORE }}'))
            "ANDROID_KEYSTORE=$env:RUNNER_TEMP\benpos-release.keystore" | Out-File -FilePath $env:GITHUB_ENV -Append
            "ANDROID_ALIAS=${{ secrets.ANDROID_ALIAS }}" | Out-File -FilePath $env:GITHUB_ENV -Append
            "ANDROID_KEYSTORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASS }}" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "تم تفعيل التوقيع بـ ANDROID_KEYSTORE."
          } else {
            Write-Host "لا توجد أسرار توقيع — سيُبنى APK غير موقّع."
          }

      - name: بناء APK أندرويد
        run: dotnet publish BENPOSDZ/BENPOSDZ.csproj -f net8.0-android -c Release -p:ApplicationDisplayVersion=${{ steps.version.outputs.version }} -p:ApplicationVersion=${{ steps.version.outputs.versionCode }} --nologo -v q

      - name: رفع APK إلى GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: BENPOSDZ/bin/Release/net8.0-android/dz.benpos.pos-Signed.apk
